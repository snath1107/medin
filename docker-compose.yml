# Optional: a local Postgres if you don't have one installed.
#   docker compose up -d
# Then use DATABASE_URL=postgresql://postgres:postgres@localhost:5432/medin
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the medin_test database used by `pytest`
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  pgdata:
